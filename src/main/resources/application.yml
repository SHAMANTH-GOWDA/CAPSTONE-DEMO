spring:
  application:
    name: capstone1-secure-auth-resilience


resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 3s
        failureRateThreshold: 50
    instances:
      mockExternalService:
        baseConfig: default
  #        slidingWindowSize: 1
  #        minimumNumberOfCalls: 1
  #        failureRateThreshold: 50
  #        waitDurationInOpenState: 10s

  ratelimiter:
    configs:
      default:
       limitForPeriod: 2
       limitRefreshPeriod: 20s
       timeoutDuration: 0s
    instances:
      LoginRateLimiter:
        baseConfig: default


management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiter:
      enabled: true